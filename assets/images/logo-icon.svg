<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric S Mark - 6 rounded blocks (favicon/icon version) -->
  <g id="s-mark">
    <!-- Top row - 2 blocks -->
    <rect x="4" y="2" width="10" height="6" rx="2" fill="#5B3BF4"/>
    <rect x="16" y="2" width="10" height="6" rx="2" fill="#5B3BF4"/>
    <!-- Middle row - 2 blocks (offset) -->
    <rect x="10" y="10" width="10" height="6" rx="2" fill="#5B3BF4"/>
    <rect x="4" y="18" width="10" height="6" rx="2" fill="#5B3BF4"/>
    <!-- Bottom row - 2 blocks -->
    <rect x="10" y="26" width="10" height="6" rx="2" fill="#5B3BF4"/>
    <rect x="22" y="26" width="10" height="6" rx="2" fill="#5B3BF4"/>
  </g>
</svg>
